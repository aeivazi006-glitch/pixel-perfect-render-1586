# Base44 development environment.
# Runs the app from the cloned source with the project's pinned package manager
# (Bun — see bun.lock / bunfig.toml) and a live-reload Vite dev server on port 3000.
services:
  web:
    image: oven/bun:1
    working_dir: /app
    command:
      - sh
      - -ec
      - |
        bun install --frozen-lockfile
        exec bun run dev --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    volumes:
      - ./:/app
      - web_node_modules:/app/node_modules
    environment:
      - NODE_ENV=development
      # Passed through bare: the platform sets it so Vite accepts the preview host.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
      - BASE44_PUBLIC_HOST_SUFFIX
    restart: on-failure
    healthcheck:
      test:
        - CMD
        - bun
        - -e
        - fetch('http://127.0.0.1:3000/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 240s

volumes:
  web_node_modules:
