# Base44 development compose — runs the app from the cloned source with live reload.
services:
  web:
    image: oven/bun:1
    working_dir: /app
    restart: on-failure
    ports:
      - "3000:3000"
    env_file:
      - /run/base44/app.env
    environment:
      - NODE_ENV=development
      # Vite >= 6.1 appends this to server.allowedHosts so the preview's external
      # hostname is accepted (the sandbox id rotates, so an exact list cannot work).
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
      - node_modules:/app/node_modules
    command:
      - sh
      - -ec
      - bun install --frozen-lockfile && exec bun run dev --port 3000 --host 0.0.0.0
    healthcheck:
      test: ["CMD-SHELL", "bun -e 'fetch(\"http://127.0.0.1:3000/\").then(r => { if (!r.ok) process.exit(1); }).catch(() => process.exit(1))'"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s

volumes:
  node_modules:
