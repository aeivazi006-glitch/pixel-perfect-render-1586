# Base44 sandbox environment for MODERNO.
#
# Runs the Vite / TanStack Start dev server straight from the cloned source so
# every edit is reflected live in the preview. There is no database or backend
# service: storefront state (cart, wishlist, recent searches) lives in the
# browser. The only entry point is the web server on host port 3000.
#
#   docker compose -f docker-compose.base44.yml up -d --build
#
# Reuse this file for local development as well; it is intentionally
# development-only (dev server, polling watchers, no production build).

services:
  web:
    image: oven/bun:1
    restart: on-failure
    working_dir: /app
    # Dependencies live in a named volume (mounted below), so install on every
    # start from the committed lockfile before booting the dev server.
    command:
      - sh
      - -ec
      - |
        bun install --frozen-lockfile
        exec bun run dev -- --host 0.0.0.0 --port 3000
    ports:
      - "3000:3000"
    environment:
      - CI=true
      # Set by the platform (1 in the preview sandbox); read by app code only
      # for sandbox-only overrides. Never hardcode a value here.
      - BASE44_PREVIEW_MODE
      # Set by the platform: extra hostnames Vite should accept (>= 6.1 appends
      # this to `server.allowedHosts`), required because the preview reaches the
      # dev server through the sandbox proxy hostname.
      - __VITE_ADDITIONAL_SERVER_ALLOWED_HOSTS
    volumes:
      - ./:/app
      - moderno_node_modules:/app/node_modules
    healthcheck:
      # Probes the dev server itself over HTTP (not just an open port).
      test:
        - CMD
        - bun
        - -e
        - "fetch('http://127.0.0.1:3000/').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 15s
      timeout: 10s
      retries: 8
      # Generous: first boot installs dependencies and compiles on demand.
      start_period: 180s

volumes:
  moderno_node_modules:
